<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Parts of Speech - Easy English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&display=swap" rel="stylesheet" />
  <style>
/* ============================================================
   styles.css — Parts of Speech Game (warm workbook aesthetic)
   ============================================================ */

:root {
  --paper:    #FBF3E2;
  --paper-2:  #F4E7CC;
  --card:     #FFFFFF;
  --ink:      #2B2117;
  --ink-soft: #7A6A52;
  --ink-faint:#B6A484;
  --line:     #ECDDBE;
  --brand:    #F0961E;     /* warm amber */
  --brand-deep:#D97706;
  --shadow:   0 1px 2px rgba(80,56,16,.06), 0 12px 28px -12px rgba(120,80,20,.28);
  --shadow-sm:0 1px 2px rgba(80,56,16,.08), 0 6px 14px -8px rgba(120,80,20,.22);
  --radius:   22px;
}

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; }

body {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    radial-gradient(circle at 50% 0%, #FFF8EA 0%, rgba(255,248,234,0) 60%),
    radial-gradient(rgba(180,140,70,.10) 1px, transparent 1px);
  background-size: 100% 100%, 26px 26px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

#root { min-height: 100%; }

button { font-family: inherit; }

/* ---------- App shell ---------- */
.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.stage {
  width: 100%;
  max-width: 880px;
  padding: 0 20px 48px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* ---------- Top bar ---------- */
.topbar {
  width: 100%;
  max-width: 880px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px;
  margin: 0 auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  letter-spacing: -0.01em;
  font-size: 18px;
}
.brand .logo {
  width: 34px; height: 34px;
  border-radius: 10px;
  background: linear-gradient(140deg, var(--brand), var(--brand-deep));
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 18px;
  box-shadow: var(--shadow-sm);
}
.topbar .spacer { flex: 1; }

.iconbtn {
  width: 44px; height: 44px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
  display: grid; place-items: center;
  cursor: pointer;
  transition: transform .12s, background .15s, color .15s, border-color .15s;
  box-shadow: var(--shadow-sm);
}
.iconbtn:hover { color: var(--brand-deep); border-color: var(--brand); transform: translateY(-1px); }
.iconbtn:active { transform: translateY(0); }
.iconbtn svg { width: 22px; height: 22px; }

.pill-progress {
  display: flex; align-items: center; gap: 10px; white-space: nowrap;
  font-weight: 600; font-size: 14px; color: var(--ink-soft);
}
.pill-progress .bar {
  width: 120px; height: 8px; border-radius: 999px;
  background: var(--paper-2); overflow: hidden;
}
.pill-progress .bar i {
  display: block; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--brand), var(--brand-deep));
  transition: width .35s cubic-bezier(.2,.7,.2,1);
}

/* ---------- Buttons ---------- */
.btn {
  border: 0; cursor: pointer;
  font-weight: 600; font-size: 17px;
  padding: 15px 26px; border-radius: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  transition: transform .12s, box-shadow .15s, background .15s;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: linear-gradient(140deg, var(--brand), var(--brand-deep));
  color: #fff;
  box-shadow: 0 1px 1px rgba(0,0,0,.08), 0 10px 22px -8px rgba(217,119,6,.7);
}
.btn-primary:hover { box-shadow: 0 1px 1px rgba(0,0,0,.08), 0 14px 28px -8px rgba(217,119,6,.85); transform: translateY(-1px); }
.btn-primary[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.btn-ghost {
  background: var(--card); color: var(--ink);
  border: 1.5px solid var(--line); box-shadow: var(--shadow-sm);
}
.btn-ghost:hover { border-color: var(--brand); color: var(--brand-deep); transform: translateY(-1px); }
.btn svg { width: 20px; height: 20px; }

/* ---------- Card ---------- */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid #00000008;
}

/* ============================================================
   Sentence view  (shared by Learn & Play)
   ============================================================ */
.sentence-card {
  position: relative;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: clamp(28px, 5vw, 56px) clamp(20px, 5vw, 52px) clamp(34px, 5vw, 56px);
  overflow: hidden;
}
.sentence-card::before {
  content: none;
}

.sentence {
  display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: center;
  gap: 2.5rem 0.45rem;
  font-family: var(--sentence-font, 'Newsreader', Georgia, serif);
  font-size: clamp(1.45rem, 1.1rem + 1.7vw, 2.45rem);
  line-height: 1.1; font-weight: 500;
  position: relative;
}
.word-wrap { position: relative; display: inline-flex; align-items: flex-start; }
.word {
  position: relative; font: inherit; color: var(--ink);
  background: transparent; border: 0;
  padding: .06em .2em; border-radius: .35em;
  cursor: pointer; white-space: nowrap;
  transition: background .15s, color .15s, transform .12s, box-shadow .15s;
}
.word:hover:not(:disabled):not(.is-rev) { background: rgba(43,33,23,.06); transform: translateY(-1px); }
.word:disabled { cursor: default; }
.word.is-rev {
  background: color-mix(in srgb, var(--c) 15%, #fff);
  color: var(--c);
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 35%, transparent);
}
.word.is-found {
  background: color-mix(in srgb, var(--c) 16%, #fff);
  color: var(--c);
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 45%, transparent);
  animation: pop .32s cubic-bezier(.2,1.3,.4,1);
}
.word.is-wrong {
  color: #DC2626; background: rgba(220,38,38,.12);
  animation: shake .42s;
}
.word.is-hint {
  box-shadow: inset 0 -0.14em 0 color-mix(in srgb, var(--c) 55%, transparent);
  animation: hintpulse 1.8s ease-in-out infinite;
}
.word.is-neutral-pos.is-rev,
.word.is-neutral-pos.is-found {
  background: color-mix(in srgb, #6B7280 14%, #fff);
  color: #6B7280;
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, #6B7280 36%, transparent);
}
.word.is-neutral-pos.is-hint {
  box-shadow: inset 0 -0.14em 0 color-mix(in srgb, #6B7280 55%, transparent);
}
.word-label {
  position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: .4em; font-weight: 600; letter-spacing: .01em;
  color: var(--c); white-space: nowrap;
  background: color-mix(in srgb, var(--c) 12%, #fff);
  padding: .15em .5em; border-radius: 999px;
  animation: labelin .26s cubic-bezier(.2,1.2,.4,1);
}
.word-label::before {
  content: ""; position: absolute; top: -4px; left: 50%; transform: translateX(-50%) rotate(45deg);
  width: 7px; height: 7px; background: inherit; border-radius: 1px;
}
.tail { font-family: var(--sentence-font, 'Newsreader', serif); color: var(--ink); align-self: flex-start; }
.noshake .word.is-wrong { animation: none; }

@keyframes pop { 0%{transform:scale(.85)} 100%{transform:scale(1)} }
@keyframes labelin { 0%{opacity:0; transform:translateX(-50%) translateY(-4px)} 100%{opacity:1; transform:translateX(-50%) translateY(0)} }
@keyframes shake { 10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(3px)} 30%,50%,70%{transform:translateX(-5px)} 40%,60%{transform:translateX(5px)} }
@keyframes hintpulse { 0%,100%{box-shadow: inset 0 -0.14em 0 color-mix(in srgb, var(--c) 30%, transparent)} 50%{box-shadow: inset 0 -0.14em 0 color-mix(in srgb, var(--c) 75%, transparent)} }

/* ============================================================
   Info screen / modal
   ============================================================ */
.info-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(43,33,23,.45); backdrop-filter: blur(3px);
  display: flex; justify-content: center; align-items: flex-start;
  overflow-y: auto; padding: 24px 16px 60px;
  animation: fade .2s ease;
}
@keyframes fade { from{opacity:0} to{opacity:1} }
.info-sheet {
  width: 100%; max-width: 760px; margin-top: 24px;
  background: var(--paper); border-radius: 26px;
  box-shadow: 0 30px 80px -20px rgba(60,40,10,.5);
  animation: sheetin .3s cubic-bezier(.2,.9,.3,1);
}
@keyframes sheetin { from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:translateY(0)} }

.info-head {
  padding: clamp(26px,4vw,40px) clamp(22px,4vw,40px) 18px;
  text-align: center; position: relative;
}
.info-head h1 { margin: 0; font-size: clamp(26px,4.5vw,38px); letter-spacing: -0.02em; }
.info-head p { margin: 8px auto 0; color: var(--ink-soft); max-width: 46ch; font-size: 16px; line-height: 1.5; }
.info-head .close { position: absolute; top: 20px; right: 20px; }

.pos-grid {
  display: grid; grid-template-columns: 1fr; gap: 12px;
  padding: 6px clamp(18px,4vw,34px) clamp(22px,4vw,34px);
}
@media (min-width: 620px) { .pos-grid { grid-template-columns: 1fr 1fr; } }

.pos-card {
  background: var(--card); border-radius: 18px; padding: 18px 18px 16px;
  box-shadow: var(--shadow-sm); border: 1px solid #00000008;
  border-left: 5px solid var(--c);
}
.pos-card .pc-name {
  font-weight: 700; font-size: 18px; color: var(--c);
  text-transform: capitalize; letter-spacing: -0.01em;
}
.pos-card .pc-def { color: var(--ink-soft); font-size: 14.5px; line-height: 1.45; margin: 4px 0 12px; }
.pos-card .pc-ex { font-family: 'Newsreader', serif; font-size: 16.5px; line-height: 1.7; color: var(--ink); }
.pos-card .pc-ex .hl { color: var(--c); font-weight: 600; background: color-mix(in srgb, var(--c) 13%, #fff); padding: 0 .25em; border-radius: .3em; }
.info-foot { padding: 0 clamp(18px,4vw,34px) clamp(26px,4vw,36px); display: flex; justify-content: center; }

/* ============================================================
   Home screen
   ============================================================ */
.home { text-align: center; padding-top: clamp(8px,3vw,32px); }
.home .hero-kicker { color: var(--brand-deep); font-weight: 700; letter-spacing: .14em; font-size: 13px; text-transform: uppercase; }
.home h1 {
  margin: 8px 0 0; letter-spacing: -0.03em; line-height: 1;
  font-size: clamp(38px, 7vw, 64px);
}
.home h1 .sketch { font-family:'Newsreader',serif; font-style: italic; font-weight: 500; }
.title-link {
  appearance: none;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  line-height: inherit;
  padding: 0;
  cursor: pointer;
}
.title-link:hover { color: var(--brand-deep); }
.home .sub { color: var(--ink-soft); font-size: 17px; margin: 14px auto 0; max-width: 40ch; line-height: 1.5; }

.section-label {
  text-align: left; font-weight: 700; font-size: 13px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-faint); margin: 0 4px 12px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.section-label .lbl-note { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--ink-faint); font-size: 11.5px; opacity: .85; }
.section-label .n { width: 20px; height: 20px; border-radius: 6px; background: var(--paper-2); color: var(--ink-soft); display:grid; place-items:center; font-size: 12px; }

.block { margin-top: clamp(28px, 4vw, 40px); text-align: left; }

.topic-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .topic-grid { grid-template-columns: repeat(3, 1fr); } }

.topic-chip {
  position: relative; cursor: pointer;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 15px;
  padding: 14px 14px; display: flex; align-items: center; gap: 11px;
  font-weight: 600; font-size: 15.5px; color: var(--ink);
  box-shadow: var(--shadow-sm);
  transition: transform .12s, border-color .15s, box-shadow .15s;
  text-transform: capitalize;
}
.topic-chip:hover { transform: translateY(-2px); }
.topic-chip .dot { width: 14px; height: 14px; border-radius: 5px; background: var(--c); flex: none; box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--c) 30%, #fff); }
.topic-chip.sel { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent), var(--shadow-sm); }
.topic-chip.all { grid-column: 1 / -1; justify-content: center; font-size: 16.5px; text-transform: none; }
.topic-chip.all .dot { background: conic-gradient(#2563EB,#0D9488,#16A34A,#7C3AED,#DB2777,#EA580C,#DC2626,#2563EB); box-shadow: none; }
.topic-chip .check { margin-left: auto; color: var(--c); display: none; }
.topic-chip.sel .check { display: block; }

.mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode-card {
  cursor: pointer; text-align: left; position: relative;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 18px;
  padding: 18px 18px; box-shadow: var(--shadow-sm);
  transition: transform .12s, border-color .15s, box-shadow .15s;
}
.mode-card:hover { transform: translateY(-2px); }
.mode-card.sel { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 25%, transparent), var(--shadow-sm); }
.mode-card .mc-ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: #fff; margin-bottom: 10px; }
.mode-card .mc-title { font-weight: 700; font-size: 19px; }
.mode-card .mc-desc { color: var(--ink-soft); font-size: 13.5px; line-height: 1.4; margin-top: 3px; }

/* sentence length selector */
.len-row { display: flex; gap: 8px; flex-wrap: wrap; }
.len-chip {
  cursor: pointer; font-family: inherit; font-weight: 600; font-size: 14px;
  color: var(--ink-soft); background: var(--card);
  border: 1.5px solid var(--line); border-radius: 999px;
  padding: 8px 20px; box-shadow: var(--shadow-sm);
  transition: transform .12s, border-color .15s, background .15s, color .15s, box-shadow .15s;
}
.len-chip:hover { transform: translateY(-1px); border-color: var(--brand); color: var(--brand-deep); }
.len-chip.sel {
  background: linear-gradient(140deg, var(--brand), var(--brand-deep));
  border-color: transparent; color: #fff;
  box-shadow: 0 2px 10px -2px color-mix(in srgb, var(--brand) 55%, transparent);
}

/* empty state */
.empty-state {
  text-align: center; padding: 48px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.empty-state .es-icon { font-size: 40px; opacity: .5; }
.empty-state h3 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
.empty-state p { margin: 0; color: var(--ink-soft); font-size: 15px; line-height: 1.5; max-width: 34ch; }

.home-cta { margin-top: clamp(30px,4vw,42px); display: flex; justify-content: center; }
.home-cta .btn { width: 100%; max-width: 360px; font-size: 18px; padding: 17px; }

/* ============================================================
   Learn / Play headers + controls
   ============================================================ */
.mode-head { text-align: center; margin: 6px 0 22px; }
.mode-head .tag {
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--brand-deep); background: color-mix(in srgb, var(--brand) 15%, #fff);
  padding: 6px 14px; border-radius: 999px;
}
.mode-head h2 { margin: 12px 0 0; font-size: clamp(22px,4vw,30px); letter-spacing: -0.02em; }
.mode-head h2 .topic-name { text-transform: capitalize; }
.mode-head .hint { color: var(--ink-soft); font-size: 15px; margin-top: 6px; }

.play-prompt {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  flex-wrap: wrap;
}
.play-prompt span:first-of-type {
  color: var(--c);
  text-transform: capitalize;
}
.prompt-dots { display: inline-flex; gap: 5px; transform: translateY(1px); }
.prompt-dots i {
  width: 10px; height: 10px; border-radius: 50%;
  background: transparent;
  box-shadow: inset 0 0 0 1.6px color-mix(in srgb,var(--c) 48%, transparent);
}
.prompt-dots i.on { background: var(--c); box-shadow: none; }

.controls { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; margin-top: 26px; }
.legend .lg { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink-soft); font-weight: 600; text-transform: capitalize; }
.legend .lg.plain { text-transform: none; }
.legend .lg.plain b { color: var(--c); text-transform: capitalize; font-weight: 700; }
.legend .lg i { width: 11px; height: 11px; border-radius: 4px; background: var(--c); }

/* feedback banner in play */
.feedback {
  position: relative; text-align: center; margin: 22px auto 0; max-width: 460px;
  border-radius: 16px; padding: 16px 20px; font-weight: 600;
  background: color-mix(in srgb, #16A34A 12%, #fff); color: #15803D;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  animation: sheetin .3s cubic-bezier(.2,.9,.3,1);
}

/* ============================================================
   Results
   ============================================================ */
.results { text-align: center; padding-top: clamp(16px,5vw,56px); display: flex; flex-direction: column; align-items: center; }
.results .stars { display: flex; gap: 10px; margin-bottom: 8px; }
.results .stars svg { width: 56px; height: 56px; }
.results .stars .star { color: var(--line); transition: transform .4s; }
.results .stars .star.on { color: var(--brand); animation: starpop .5s cubic-bezier(.2,1.4,.4,1) both; }
.results .stars .star.on:nth-child(2){ animation-delay:.12s } .results .stars .star.on:nth-child(3){ animation-delay:.24s }
@keyframes starpop { 0%{transform:scale(0) rotate(-30deg); opacity:0} 100%{transform:scale(1) rotate(0); opacity:1} }
.results h2 { font-size: clamp(28px,5vw,44px); margin: 14px 0 0; letter-spacing: -0.02em; }
.results .msg { color: var(--ink-soft); font-size: 17px; margin: 10px auto 0; max-width: 40ch; line-height: 1.5; }
.score-cards { display: flex; gap: 14px; margin: 30px 0; flex-wrap: wrap; justify-content: center; }
.score-cards .sc { background: var(--card); border-radius: 18px; padding: 20px 26px; box-shadow: var(--shadow-sm); min-width: 130px; }
.score-cards .sc .v { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.score-cards .sc .l { color: var(--ink-soft); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-top: 8px; }
.results .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

.fade-in { animation: sheetin .35s cubic-bezier(.2,.9,.3,1) both; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; }
}

  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel">
/* ============================================================
   data.jsx — Parts of Speech metadata + tagged sentences
   ============================================================ */

const POS = {
  noun:         { label: "noun",         color: "#2563EB",
    def: "Names a person, place, thing, or idea.",
    ex: [["The cat sleeps on the mat.", "cat"], ["John visits the park.", "park"]] },
  pronoun:      { label: "pronoun",      color: "#0D9488",
    def: "Takes the place of a noun.",
    ex: [["She loves to read books.", "She"], ["They played soccer.", "They"]] },
  verb:         { label: "verb",         color: "#DC2626",
    def: "Shows an action or a state of being.",
    ex: [["The dog runs fast.", "runs"], ["We are happy today.", "are"]] },
  adjective:    { label: "adjective",    color: "#16A34A",
    def: "Describes or modifies a noun.",
    ex: [["The fluffy kitten purrs.", "fluffy"], ["A tall tree stands alone.", "tall"]] },
  adverb:       { label: "adverb",       color: "#7C3AED",
    def: "Modifies a verb, adjective, or another adverb.",
    ex: [["She sings beautifully.", "beautifully"], ["He runs quickly.", "quickly"]] },
  preposition:  { label: "preposition",  color: "#EA580C",
    def: "Shows how a noun relates to another word.",
    ex: [["The ball is under the table.", "under"], ["We walked through the forest.", "through"]] },
  conjunction:  { label: "conjunction",  color: "#DB2777",
    def: "Connects words, phrases, or clauses.",

// Fisher–Yates shuffle (returns new array)
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- Confetti ---------- */
window.fireConfetti = function (opts) {
  opts = opts || {};
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const count = opts.count || 110;
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  const colors = opts.colors || ['#F0961E','#DC2626','#2563EB','#16A34A','#DB2777','#7C3AED','#0D9488','#EA580C'];
  const ox = opts.x != null ? opts.x : innerWidth / 2;
  const oy = opts.y != null ? opts.y : innerHeight * 0.36;
  const parts = [];
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 4 + Math.random() * 8;
    parts.push({ x: ox, y: oy, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 5,
      g: 0.16 + Math.random() * 0.1, s: 6 + Math.random() * 8, rot: Math.random() * 6.28,
      vr: (Math.random() - 0.5) * 0.35, color: colors[i % colors.length],
      life: 0, max: 70 + Math.random() * 50, shape: Math.random() < 0.55 ? 0 : 1 });
  }
  function frame() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    let alive = false;
    for (const p of parts) {
      p.life++; if (p.life > p.max) continue; alive = true;
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vx *= 0.99;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
      if (p.shape === 0) ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.62);
      else { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 6.28); ctx.fill(); }
      ctx.restore();
    }
    if (alive) requestAnimationFrame(frame); else canvas.remove();
  }
  requestAnimationFrame(frame);
};

/* ---------- Sentence view (shared) ----------
   words:   array of {w, p, t}
   states:  array aligned to words -> { rev, found, wrong, hint }
   onTap:   (i) => void  (omit to make read-only)
*/
function SentenceView({ words, states, onTap, showPosColors = true }) {
  return (
    <div className="sentence">
      {words.map((tok, i) => {
        const st = states ? states[i] : {};
        const pos = POS[tok.p];
        const showLabel = st.rev || st.found || st.wrongReveal;
        const cls = ["word"];
        if (st.rev) cls.push("is-rev");
        if (st.found) cls.push("is-found");
        if (st.wrong) cls.push("is-wrong");
        if (st.hint) cls.push("is-hint");
        if (!showPosColors) cls.push("is-neutral-pos");
        const style = pos ? { "--c": showPosColors ? pos.color : "#6B7280" } : undefined;
        return (
          <span className="word-wrap" key={i}>
            <button
              className={cls.join(" ")}
              style={style}
              disabled={!onTap}
              onClick={onTap ? () => onTap(i) : undefined}
            >
              {tok.w}
              {showLabel && pos && <span className="word-label" style={{ "--c": showPosColors ? pos.color : "#6B7280" }}>{pos.label}</span>}
            </button>
            {tok.t && <span className="tail">{tok.t}</span>}
          </span>
        );
      })}
    </div>
  );
}

/* ---------- Highlight a single word inside an example ---------- */

              </button>
              {POS_ORDER.map((key) => (
                <button key={key} className={"topic-chip" + (topics.includes(key) ? " sel" : "")} onClick={() => toggle(key)} style={{ "--c": POS[key].color }}>
                  <span className="dot" /> {POS[key].label}
                  <span className="check"><Icon.check style={{ width: 16, height: 16 }} /></span>
                </button>
              ))}
            </div>
          </div>

          <div className="block">
            <div className="section-label"><span className="n">2</span> Sentence length</div>
            <div className="len-row">
              {LENGTHS.map(({ key, label }) => (
                <button key={key} className={"len-chip" + (length === key ? " sel" : "")} onClick={() => setLength(key)}>{label}</button>
              ))}
            </div>
          </div>

          <div className="block">
            <div className="section-label"><span className="n">3</span> Choose a mode</div>
            <div className="mode-row">
              <button className={"mode-card" + (mode === "learn" ? " sel" : "")} onClick={() => setMode("learn")}>
                <div className="mc-ico" style={{ background: "linear-gradient(140deg,#0D9488,#0f766e)" }}><Icon.book /></div>
                <div className="mc-title">Learn</div>
                <div className="mc-desc">Tap any word to reveal its part of speech.</div>
              </button>
              <button className={"mode-card" + (mode === "play" ? " sel" : "")} onClick={() => setMode("play")}>
                <div className="mc-ico" style={{ background: "linear-gradient(140deg,var(--brand),var(--brand-deep))" }}><Icon.play /></div>
                <div className="mc-title">Play</div>
                <div className="mc-desc">Spot and highlight every matching word.</div>
              </button>
            </div>
          </div>

          <div className="home-cta">
            <button className="btn btn-primary" onClick={onStart} disabled={none}>
              {none ? "Select a topic to begin" : (mode === "learn" ? "Start learning" : "Start playing")} <Icon.arrow />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ===================== LEARN ===================== */
function LearnScreen({ topics, length, tweaks, onExit, onInfo }) {
  const all = isAll(topics);
  const list = useM(() => {
    let pool = all ? SENTENCES : SENTENCES.filter((s) => s.words.some((x) => topics.includes(x.p)));
    if (length !== "all") pool = pool.filter((s) => s.len === length);
    return shuffle(pool).slice(0, 10);
  }, [topics.join(","), length]);
  const [si, setSi] = useS(0);
  const [rev, setRev] = useS({});
  const [colorRevealed, setColorRevealed] = useS(false);
  if (!list.length) return (
    <div className="app">
      <TopBar onBack={onExit} />
      <div className="stage"><div className="card empty-state">
        <span className="es-icon">📭</span>
        <h3>No sentences found</h3>
        <p>Try choosing "All" for sentence length, or pick different topics.</p>
        <button className="btn btn-primary" onClick={onExit}>Back to home <Icon.arrow /></button>
      </div></div>
    </div>
  );
  const sentence = list[si] || list[0];

  function tap(i) { setRev((r) => ({ ...r, [i]: !r[i] })); }
  function revealAll() { const a = {}; sentence.words.forEach((_, i) => (a[i] = true)); setRev(a); }
  function next() { setRev({}); setSi((v) => Math.min(v + 1, list.length - 1)); }

  const allShown = sentence.words.every((_, i) => rev[i]);
  const isLastSentence = si + 1 >= list.length;
  const states = sentence.words.map((tok, i) => ({
    rev: !!rev[i],
    hint: !all && topics.includes(tok.p) && !rev[i],
  }));
  const legendKeys = all ? POS_ORDER : topics;

  let title, hint;
  if (all) { title = "Tap a word to reveal its job"; hint = "Every word is tappable — see what part of speech it is."; }
  else if (topics.length === 1) {
    const p = POS[topics[0]];
    title = <span>Find the <span className="topic-name" style={{ color: p.color }}>{p.label}s</span></span>;
    hint = `Underlined words are ${p.label}s. Tap any word to reveal its type.`;
  } else { title = "Tap a word to reveal its job"; hint = "Your chosen types are underlined. Tap any word to reveal its job."; }

  return (
    <div className="app">
      <TopBar onBack={onExit} onInfo={onInfo}
        progress={{ label: `Sentence ${si + 1} / ${list.length}`, pct: ((si + 1) / list.length) * 100 }} />
      <div className="stage">
        <div className="mode-head fade-in">
          <span className="tag"><Icon.book style={{ width: 15, height: 15 }} /> Learn mode</span>
          <h2>{title}</h2>
          <div className="hint">{hint}</div>
        </div>

        <div className="sentence-card fade-in">
          <SentenceView words={sentence.words} states={states} onTap={tap} showPosColors={colorRevealed} />
        </div>

        {colorRevealed && tweaks.showLegend && (
          <div className="legend">
            {legendKeys.map((k) => (
              <span className="lg" key={k} style={{ "--c": POS[k].color }}><i /> {POS[k].label}</span>
            ))}
          </div>
        )}

        <div className="controls">
          <button className="btn btn-ghost" onClick={() => setColorRevealed((v) => !v)}>
            {colorRevealed ? "Hide colours" : "Reveal colours"}
          </button>
          <button className="btn btn-ghost" onClick={allShown ? () => setRev({}) : revealAll}>
            {allShown ? "Hide all" : "Reveal all"}
          </button>
          <button className="btn btn-primary" onClick={isLastSentence ? onExit : next}>
            {isLastSentence ? "Home" : "Next sentence"} <Icon.arrow />
          </button>
        </div>
      </div>
    </div>
  );
}

/* ===================== PLAY ===================== */
function buildQuestions(topics, length, count) {
  count = count || 10;
  const elig = (s) => topics.filter((t) => s.words.some((x) => x.p === t));
  let pool = SENTENCES.filter((s) => elig(s).length > 0);
  if (length !== "all") pool = pool.filter((s) => s.len === length);
  pool = shuffle(pool);
  const target = Math.min(count, pool.length);
  const qs = []; let i = 0;
  while (qs.length < target && pool.length) {
    const s = pool[i % pool.length];
    const e = elig(s);
    qs.push({ words: s.words, target: e[Math.floor(Math.random() * e.length)] });
    i++;
  }
  return qs;
}

function PlayScreen({ topics, length, tweaks, onExit, onInfo, onFinish }) {
  const questions = useM(() => buildQuestions(topics, length, tweaks.questionsPerRound), [topics.join(","), length, tweaks.questionsPerRound]);
  const [qi, setQi] = useS(0);
  const [found, setFound] = useS([]);
  const [wrong, setWrong] = useS(-1);
  const [wrongReveal, setWrongReveal] = useS({});
  const [done, setDone] = useS(false);
  const stats = useR({ correct: 0, wrong: 0, perfect: 0 });
  const qMistakes = useR(0);
  const foundRef = useR([]);
  const doneRef = useR(false);

  const q = questions[qi] || { words: [], target: POS_ORDER[0] };
  const targets = useM(() => q.words.map((x, i) => (x.p === q.target ? i : -1)).filter((i) => i >= 0), [qi, questions]);

  function tap(i) {
    if (doneRef.current || foundRef.current.includes(i)) return;
    const tok = q.words[i];
    if (tok.p === q.target) {
      foundRef.current = [...foundRef.current, i];
      setFound(foundRef.current);
      stats.current.correct++;
      if (foundRef.current.length === targets.length) {
        if (qMistakes.current === 0) stats.current.perfect++;
        doneRef.current = true;
        setDone(true);
        if (tweaks.confetti) window.fireConfetti({ y: innerHeight * 0.4 });
      }
    } else {
      stats.current.wrong++;
      qMistakes.current++;
      setWrong(i);
      setWrongReveal((m) => ({ ...m, [i]: true }));
      setTimeout(() => setWrong((v) => (v === i ? -1 : v)), 460);
      setTimeout(() => {
        setWrongReveal((m) => {
          const nextMap = { ...m };
          delete nextMap[i];
          return nextMap;
        });
      }, 2000);
    }
  }

  function next() {
    if (qi + 1 >= questions.length) {
      onFinish({ ...stats.current, total: questions.length });
    } else {
      foundRef.current = []; doneRef.current = false;
      setQi(qi + 1); setFound([]); setDone(false); setWrong(-1); setWrongReveal({}); qMistakes.current = 0;
    }
  }

  const states = q.words.map((tok, i) => ({ found: found.includes(i), wrong: wrong === i, wrongReveal: !!wrongReveal[i] }));
  if (!questions.length) return (
    <div className="app">
      <TopBar onBack={onExit} />
      <div className="stage"><div className="card empty-state">
        <span className="es-icon">📭</span>
        <h3>No sentences found</h3>
        <p>Try choosing "All" for sentence length, or pick different topics.</p>
        <button className="btn btn-primary" onClick={onExit}>Back to home <Icon.arrow /></button>
      </div></div>
    </div>
  );
  const pos = POS[q.target];

  return (
    <div className="app">
      <TopBar onBack={onExit} onInfo={onInfo}
        progress={{ label: `Question ${qi + 1} / ${questions.length}`, pct: (qi / questions.length) * 100 }} />
      <div className="stage">
        <div className="mode-head fade-in" key={qi}>
          <span className="tag">
            <Icon.play style={{ width: 14, height: 14 }} /> Play mode
          </span>
          <h2 className="play-prompt" style={{ "--c": pos.color }}>
            Find {targets.length > 1 ? "all the" : "the"} <span>{pos.label}{targets.length > 1 ? "s" : ""}</span>
            <span className="dots prompt-dots" aria-label={`${found.length} of ${targets.length} found`}>
              {targets.map((_, k) => <i key={k} className={k < found.length ? "on" : ""} />)}
            </span>
          </h2>
        </div>

        <div className="sentence-card fade-in" key={"s" + qi}>
          <SentenceView words={q.words} states={states} onTap={tap} />
        </div>

        {done ? (
          <>
            <div className="feedback"><Icon.check style={{ width: 24, height: 24 }} /> Nice work — you found {targets.length === 1 ? "it" : "them all"}!</div>
            <div className="controls">
              <button className="btn btn-primary" onClick={next}>
                {qi + 1 >= questions.length ? "See results" : "Next question"} <Icon.arrow />
              </button>
            </div>
          </>
        ) : (
          <div className="legend">
            <span className="lg plain" style={{ "--c": pos.color }}><i /> Tap each <b>{pos.label}</b> in the sentence above</span>
          </div>
        )}
      </div>
    </div>
  );
}

/* ===================== RESULTS ===================== */
function ResultsScreen({ result, tweaks, onReplay, onHome }) {
  const totalTaps = result.correct + result.wrong;
  const acc = totalTaps ? Math.round((result.correct / totalTaps) * 100) : 100;
  const stars = acc >= 90 ? 3 : acc >= 65 ? 2 : 1;
  const msgs = {
    3: "Outstanding — you've really got this!",
    2: "Great job! A little more practice and you'll ace it.",
    1: "Good effort — try again to sharpen your eye.",
  };

  useE(() => {
    if (!tweaks.confetti) return;
    const t = setTimeout(() => window.fireConfetti({ count: stars >= 3 ? 160 : 90 }), 250);
    return () => clearTimeout(t);
  }, []);

  return (
    <div className="app">
      <TopBar />
      <div className="stage">
        <div className="results fade-in">
          <div className="stars">
            {[0, 1, 2].map((i) => <Icon.star key={i} className={"star" + (i < stars ? " on" : "")} />)}
          </div>
          <h2>{stars === 3 ? "Brilliant!" : stars === 2 ? "Well done!" : "Nice try!"}</h2>
          <p className="msg">{msgs[stars]}</p>

          <div className="score-cards">
            <div className="sc"><div className="v" style={{ color: "#16A34A" }}>{result.correct}</div><div className="l">Words found</div></div>
            <div className="sc"><div className="v" style={{ color: "#D97706" }}>{acc}%</div><div className="l">Accuracy</div></div>
            <div className="sc"><div className="v" style={{ color: "#2563EB" }}>{result.perfect}/{result.total}</div><div className="l">Perfect</div></div>
          </div>

          <div className="actions">
            <button className="btn btn-ghost" onClick={onHome}><Icon.back /> Home</button>
            <button className="btn btn-primary" onClick={onReplay}><Icon.refresh /> Play again</button>
          </div>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { HomeScreen, LearnScreen, PlayScreen, ResultsScreen, buildQuestions });

    filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
`;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  </script>

  <script type="text/babel">
/* ============================================================
   app.jsx — routing/state + tweaks + info overlay + mount
   ============================================================ */
const { useState: uS } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#F0961E",
  "sentenceFont": "serif",
  "questionsPerRound": 10,
  "confetti": true,
  "shake": true,
  "showLegend": true
}/*EDITMODE-END*/;

const FONT_MAP = {
  serif:   "'Newsreader', Georgia, serif",
  sans:    "'Bricolage Grotesque', system-ui, sans-serif",
  classic: "Georgia, 'Times New Roman', serif",
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = uS("home");          // home | learn | play | results
  const [topics, setTopics] = uS(POS_ORDER.slice()); // multi-select; all selected by default
  const [length, setLength] = uS("all");
  const [mode, setMode] = uS("learn");
  const [result, setResult] = uS(null);
  const [infoOpen, setInfoOpen] = uS(false);

  const tweaks = {
    confetti: t.confetti, shake: t.shake, showLegend: t.showLegend,
    questionsPerRound: t.questionsPerRound,
  };

  function start() { if (topics.length) setScreen(mode); }

  const wrapStyle = {
    "--brand": t.accent,
    "--brand-deep": `color-mix(in srgb, ${t.accent} 76%, #000)`,
    "--sentence-font": FONT_MAP[t.sentenceFont] || FONT_MAP.serif,
  };

  return (
    <div className={"root-wrap" + (t.shake ? "" : " noshake")} style={wrapStyle}>
      {screen === "home" && (
        <HomeScreen topics={topics} setTopics={setTopics} length={length} setLength={setLength}
          mode={mode} setMode={setMode} onStart={start} onInfo={() => setInfoOpen(true)} />
      )}
      {screen === "learn" && (
        <LearnScreen topics={topics} length={length} tweaks={tweaks}
          onExit={() => setScreen("home")} onInfo={() => setInfoOpen(true)} />
      )}
      {screen === "play" && (
        <PlayScreen topics={topics} length={length} tweaks={tweaks}
          onExit={() => setScreen("home")} onInfo={() => setInfoOpen(true)}
          onFinish={(r) => { setResult(r); setScreen("results"); }} />
      )}
      {screen === "results" && (
        <ResultsScreen result={result} tweaks={tweaks}
          onReplay={() => setScreen("play")} onHome={() => setScreen("home")} />
      )}

      {infoOpen && (
        <div className="info-overlay" onClick={(e) => { if (e.target === e.currentTarget) setInfoOpen(false); }}>
          <InfoContent onClose={() => setInfoOpen(false)} />
        </div>
      )}

      <TweaksPanel>
        <TweakSection label="Look & feel" />
        <TweakColor label="Accent color" value={t.accent}
          options={["#F0961E", "#2563EB", "#0D9488", "#E11D48"]}
          onChange={(v) => setTweak('accent', v)} />
        <TweakRadio label="Sentence font" value={t.sentenceFont}
          options={["serif", "sans", "classic"]}
          onChange={(v) => setTweak('sentenceFont', v)} />
        <TweakToggle label="Color legend in Learn" value={t.showLegend}
          onChange={(v) => setTweak('showLegend', v)} />

        <TweakSection label="Play mode" />
        <TweakSlider label="Questions per round" value={t.questionsPerRound} min={5} max={15} unit=" Qs"
          onChange={(v) => setTweak('questionsPerRound', v)} />
        <TweakToggle label="Confetti on correct" value={t.confetti}
          onChange={(v) => setTweak('confetti', v)} />
        <TweakToggle label="Shake on wrong" value={t.shake}
          onChange={(v) => setTweak('shake', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
